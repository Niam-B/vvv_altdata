name: old-vioc-history
# First-seen dates and review_count history of current stores under their pre-late-2025
# store.vioc.com URLs (Wayback). Resumable: re-run until phase 4 shows remaining 0.
on: workflow_dispatch
concurrency: old-vioc-history
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python collectors/old_vioc_history.py
      - run: python analysis/review_panel.py
      - if: always()
        run: |
          git config user.name "collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hist
          git commit -m "old vioc history $(date -u +%FT%H%MZ)" || echo "no changes"
          git pull --rebase && git push
