name: master-crawl
on: workflow_dispatch
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python collectors/vioc_master.py
      - run: |
          git config user.name "collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ref
          git commit -m "master crawl $(date -u +%F)" || echo "no changes"
          git pull --rebase && git push
